<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DM Board · Deal Engine</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14181f;--mute:#6b7280;--line:#e3e6eb;--brand:#0f2a43;--go:#0a7d4f;--goBg:#e7f6ee;--warn:#b45309;--warnBg:#fff4e0;--bad:#b42318;--badBg:#fdecea;--blue:#1d4ed8;--blueBg:#e8efff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
header{background:var(--brand);color:#fff;padding:0 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.logo{font-weight:700;font-size:16px;padding:14px 0;white-space:nowrap}
.logo span{opacity:.6;font-weight:500}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;color:#fff;opacity:.65;padding:16px 12px;border-bottom:3px solid transparent;font-weight:600}
nav button.on{opacity:1;border-bottom-color:#fff}
.who{display:flex;align-items:center;gap:10px;font-size:14px;padding:8px 0}
.who button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:6px;padding:5px 10px;font-size:13px}
main{padding:20px;max-width:1500px;margin:0 auto}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:12px;margin:0 0 10px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.sec{margin-top:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .n{font-size:28px;font-weight:700;line-height:1.1}
.tile .n small{font-size:15px;color:var(--mute);font-weight:600}
.tile .l{font-size:13px;color:var(--mute);margin-top:2px}
.tile.good .n{color:var(--go)}.tile.warn .n{color:var(--warn)}.tile.bad .n{color:var(--bad)}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],select{width:100%;border:1px solid #cfd4dc;border-radius:8px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px}
.btn{border:1px solid #cfd4dc;background:#fff;border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;color:var(--ink)}
.btn.p{background:var(--go);border-color:var(--go);color:#fff}
.btn.d{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.r{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.big{padding:12px 18px;font-size:15px;width:100%;margin-top:18px}
.btn.xl{padding:11px 8px;font-size:14.5px;flex:1}
.btn.s{padding:4px 9px;font-size:12.5px}
.btn.q{border-color:transparent;background:none;color:var(--mute);padding:6px 6px}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.addbar input{flex:1;min-width:220px;font-size:16px;padding:12px 14px}
.addbar .btn{padding:12px 16px;font-size:15px}
.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-left:5px solid #cbd2dc;border-radius:12px;padding:14px}
.card.recv{border-left-color:var(--warn)}
.card.open{border-left-color:var(--bad);background:#fffafa}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.h{font-weight:700;text-decoration:none;color:var(--blue);word-break:break-all}
.clock{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:10px}
.dir{font-size:13px;font-weight:600;color:var(--mute);margin-top:2px}
.dir.recv{color:var(--warn)}.dir.open{color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid #eef0f3}
.row:last-child{border-bottom:0}
.row .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:64px}
.row .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--mute)}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:#eef0f3;white-space:nowrap}
.pill.talking,.pill.qualifying,.pill.qualified,.pill.link_sent{background:var(--blueBg);color:var(--blue)}
.pill.booked{background:var(--goBg);color:var(--go)}.pill.ghosted{background:var(--warnBg);color:var(--warn)}
.tag{font-size:11.5px;font-weight:700;border-radius:5px;padding:2px 6px;background:#eef0f3}
.tag.b{background:var(--badBg);color:var(--bad)}.tag.w{background:var(--warnBg);color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #eef0f3;vertical-align:middle}
td.num,th.num{text-align:right}
td select{width:auto;padding:5px 8px}
.rank{font-weight:700;color:var(--mute);width:34px}
.bign{font-size:22px;font-weight:700}
.seg{display:inline-flex;border:1px solid #cfd4dc;border-radius:8px;overflow:hidden;margin-bottom:14px}
.seg button{border:0;background:#fff;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--mute)}
.seg button.on{background:var(--brand);color:#fff}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.line input[type=text]{flex:1;min-width:140px}
.line select{width:auto}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.gate{max-width:420px;margin:12vh auto;padding:0 16px}
.gate .box{padding:26px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.people button{background:#fff;border:1px solid #cfd4dc;border-radius:10px;padding:16px 10px;font-weight:700}
.people button small{display:block;font-weight:500;color:var(--mute);margin-top:2px}
.alert{background:var(--badBg);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14181f;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}#toast.err{background:var(--bad)}
@media(max-width:900px){.grid2{grid-template-columns:1fr}main{padding:14px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const SITE=(location.origin+location.pathname).replace(/\/(index\.html)?$/,'');
const API='https://dgnbxykkfnnkcfbycozu.supabase.co/functions/v1/board';
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let code=LS.get('de_code')||'',meId=LS.get('de_me')||'',tab=LS.get('de_tab')||'';
let S=null,busy=false,skew=0,sig='',draft={ig:''},ui={deadFor:null,range:'week',q:'',filter:'open'};
try{const qp=new URLSearchParams(location.search);if(qp.get('k')){code=qp.get('k');LS.set('de_code',code);history.replaceState(null,'',location.pathname)}}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const OPEN=['talking','qualifying','qualified','link_sent'];
const LABEL={talking:'Discovery',qualifying:'Qualifying',qualified:'Ready to book',link_sent:'Link sent',booked:'Booked',ghosted:'Gone quiet',dead:'Dead'};
const DEAD=['No money','Not interested','Not the decision maker','Not a fit','Stopped replying','Spam / wrong person'];
const ROLE={setter:'Setter',booker:'Setter',opener:'Setter',manager:'Manager'};

const dfmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago'});
const dayOf=ts=>dfmt.format(new Date(ts));
const nowMs=()=>Date.now()+skew;
function rangeStart(r){const t=dayOf(nowMs());if(r==='today')return t;const d=new Date(t+'T00:00:00Z');if(r==='week')d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));else d.setUTCDate(d.getUTCDate()-29);return d.toISOString().slice(0,10)}
const inR=(ts,r)=>!!ts&&dayOf(ts)>=rangeStart(r);
const el=c=>Math.max(0,nowMs()-Date.parse(c.last_activity_at));
// Stopwatch text: minutes and seconds, then hours, then days.
function fmt(ms){const s=Math.floor(ms/1000),p=n=>String(n).padStart(2,'0');if(s<3600)return p(Math.floor(s/60))+':'+p(s%60);if(s<86400)return Math.floor(s/3600)+'h '+p(Math.floor(s%3600/60))+'m';return Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h'}
const nm=id=>{const s=S.setters.find(x=>x.id===id);return s?s.name:'—'};
const me=()=>S&&S.setters.find(s=>s.id===meId&&s.active);
const isOpen=c=>OPEN.includes(c.stage);
const isLive=c=>isOpen(c)&&el(c)<S.cfg.bench*60e3;
const isBench=c=>isOpen(c)&&!isLive(c);
const waiting=c=>isOpen(c)&&c.last_dir==='received';
// Takeover: the prospect's message has sat unanswered past the limit.
const takeable=c=>waiting(c)&&el(c)>=S.cfg.take*60e3&&!(S.cfg.protect&&c.stage==='link_sent');
const setters=()=>S.setters.filter(s=>s.active&&s.role!=='manager');
const mineOf=id=>S.conversations.filter(c=>c.booker_id===id);
const bucket=c=>(isLive(c)?0:2)+(takeable(c)?1:0);
const sigNow=()=>S?S.conversations.filter(isOpen).map(c=>c.id+bucket(c)).join():'';

function toast(t,err){const e=$('#toast');e.textContent=t;e.className='on'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',err?4500:2000)}
async function api(action,data){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action,code,setter_id:meId||null},data||{}))});
  const j=await r.json().catch(()=>({error:'Bad response'}));
  if(!r.ok||j.error){const e=new Error(j.error||'Something went wrong');e.status=r.status;throw e}
  return j;
}
async function refresh(render){
  try{S=await api('state');skew=Date.parse(S.now)-Date.now();if(render!==false)draw()}
  catch(e){if(e.status===401){code='';LS.set('de_code',null);S=null;draw();toast('Wrong access code',true)}else if(render!==false)toast('Connection problem, retrying',true)}
}
async function act(action,data,msg){
  if(busy)return null;busy=true;
  try{const r=await api(action,data);if(msg)toast(msg);await refresh();return r}
  catch(e){toast(e.message,true);await refresh();return null}
  finally{busy=false}
}
function copy(t){const done=()=>toast('Copied');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>{});}

/* ---------- pieces ---------- */
const B=(a,id,txt,cls)=>`<button class="btn ${cls||'s'}" data-a="${a}" data-id="${id}">${txt}</button>`;
const ig=c=>`<a class="h" href="https://ig.me/m/${encodeURIComponent(c.ig_handle)}" target="_blank" rel="noopener">@${esc(c.ig_handle)}</a>`;
const clock=(c,cls)=>`<span class="${cls||'t'}" data-ts="${Date.parse(c.last_activity_at)}">${fmt(el(c))}</span>`;
function dirText(c,mine){const t=takeable(c);if(c.last_dir==='received')return `<span class="dir ${t?'open':'recv'}">${t?'Open to take over · ':''}${mine?'They replied · your move':'They replied · no answer yet'}</span>`;return `<span class="dir">${mine?'You sent · waiting on them':'Setter sent · waiting on them'}</span>`}
function stageBtns(c){const i=OPEN.indexOf(c.stage),nx=OPEN[i+1],pv=OPEN[i-1];return `${nx?B('mv',c.id+'|'+nx,LABEL[nx]+' →'):''}${B('mv',c.id+'|booked','Booked ✓','s p')}${pv?B('mv',c.id+'|'+pv,'←','s q'):''}${B('deadq',c.id,'Dead','s q')}`}
const deadRow=c=>`<div class="acts">${DEAD.map((r,i)=>B('dead',c.id+'|'+i,r)).join('')}${B('deadx','','Cancel','s q')}</div>`;
function card(c){
  const t=takeable(c);
  return `<div class="card ${t?'open':c.last_dir==='received'?'recv':''}">
    <div class="top">${ig(c)}<span class="pill ${c.stage}">${LABEL[c.stage]}</span></div>
    ${clock(c,'clock')}<div>${dirText(c,true)}</div>
    <div class="acts">${B('ping',c.id+'|sent','Message sent','xl d')}${B('ping',c.id+'|received','Message received','xl')}</div>
    ${ui.deadFor===c.id?deadRow(c):`<div class="acts">${stageBtns(c)}</div>`}
  </div>`;
}
function benchRow(c){
  return `<div class="row">${ig(c)}<span class="pill ${c.stage}">${LABEL[c.stage]}</span>${clock(c)}${dirText(c,true)}<span class="sp">${ui.deadFor===c.id?deadRow(c):B('ping',c.id+'|sent','Sent','s d')+B('ping',c.id+'|received','Received')+stageBtns(c)}</span></div>`;
}
function tile(n,l,cls){return `<div class="tile ${cls||''}"><div class="n">${n}</div><div class="l">${l}</div></div>`}
function speed(id,r){const rows=S.counts.filter(c=>c.setter_id===id&&c.day>=rangeStart(r)),n=rows.reduce((a,c)=>a+c.replies,0),f=rows.reduce((a,c)=>a+c.fast,0),s=rows.reduce((a,c)=>a+Number(c.reply_secs),0);return{n,pct:n?Math.round(f/n*100)+'%':'—',avg:n?fmt(s/n*1000):'—'}}

/* ---------- screens ---------- */
function gate(){return `<div class="gate"><div class="box"><h2>DM Board · Deal Engine</h2><p class="note">Enter the team access code. You only do this once on this device.</p><label>Access code</label><input type="text" id="codeIn" autocomplete="off" autocapitalize="off"><button class="btn d big" data-a="enter">Enter</button></div></div>`}
function who(){const ppl=S.setters.filter(s=>s.active);return `<div class="gate" style="max-width:560px"><div class="box"><h2>Who are you?</h2><p class="note">Pick your name. The board remembers it on this device.</p><div class="people">${ppl.map(s=>`<button data-a="pick" data-id="${s.id}">${esc(s.name)}<small>${ROLE[s.role]}</small></button>`).join('')}</div></div></div>`}
function tabsFor(m){const t=m.role==='manager'?[['team','Team']]:[['mine','My conversations'],['team','Team']];t.push(['lb','Leaderboard'],['all','Who has what']);if(S.is_admin)t.push(['admin','Manager']);return t}
function shell(m){return `<header><div class="logo">DM Board <span>· Deal Engine</span></div><nav>${tabsFor(m).map(t=>`<button class="${t[0]===tab?'on':''}" data-a="tab" data-id="${t[0]}">${t[1]}</button>`).join('')}</nav><div class="who"><span>${esc(m.name)} · ${ROLE[m.role]}</span><button data-a="switch">Switch</button></div></header>`}

function mineView(m){
  const mine=mineOf(m.id),live=mine.filter(isLive).sort((a,b)=>(b.last_dir==='received')-(a.last_dir==='received')||el(b)-el(a)),bench=mine.filter(isBench).sort((a,b)=>el(a)-el(b));
  const wait=mine.filter(waiting).length,risk=mine.filter(takeable).length,bT=mine.filter(c=>inR(c.booked_at,'today')).length,bW=mine.filter(c=>c.stage==='booked'&&inR(c.booked_at,'week')),sp=speed(m.id,'today'),cap=S.cfg.cap;
  return `<div class="tiles">${tile(`${live.length}<small>/${cap}</small>`,'Live conversations',live.length>cap?'bad':live.length===cap?'good':'')}${tile(bench.length,'On the bench')}${tile(wait,'Waiting on your reply',risk?'bad':wait?'warn':'')}${tile(bT,'Booked today',bT?'good':'')}${tile(mine.filter(c=>inR(c.booked_at,'week')).length,'Booked this week')}${tile(sp.pct,`Replies inside ${S.cfg.take} min today`)}</div>
  ${risk?`<div class="alert">${risk} of your conversations ${risk===1?'has':'have'} gone ${S.cfg.take}+ minutes without a reply. Another setter can take ${risk===1?'it':'them'} over.</div>`:''}
  <div class="addbar"><input type="text" id="addIg" data-f="ig" value="${esc(draft.ig)}" placeholder="New conversation: @handle or paste the profile link" autocomplete="off" autocapitalize="off">${B('add','received','+ They messaged me','d')}${B('add','sent','+ I messaged them',' ')}</div>
  <h3>Live · ${live.length} of ${cap}${live.length>cap?' · over the limit':''}</h3>
  ${live.length?`<div class="live">${live.map(card).join('')}</div>`:`<div class="box empty">No live conversations. Add one above. A conversation stays live for ${S.cfg.bench} minutes after the last message.</div>`}
  <div class="box sec"><h3>Bench · ${bench.length} · quiet for ${S.cfg.bench}+ minutes, still yours to check</h3>${bench.map(benchRow).join('')||'<div class="empty">Nothing on the bench.</div>'}</div>
  <div class="box sec"><h3>Booked this week · ${bW.length}</h3>${bW.map(c=>`<div class="row">${ig(c)}<span class="pill booked">Booked</span><span class="note">${new Date(c.booked_at).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}</span><span class="sp">${B('mv',c.id+'|link_sent','Undo','s q')}</span></div>`).join('')||'<div class="empty">None yet this week.</div>'}</div>`;
}

function teamView(m){
  const st=setters(),canTake=m.role!=='manager';
  const open=S.conversations.filter(c=>takeable(c)&&c.booker_id!==m.id).sort((a,b)=>el(b)-el(a));
  const q=ui.q.trim().toLowerCase().replace(/^@/,''),hit=c=>!q||c.ig_handle.includes(q);
  const all=S.conversations.filter(isOpen);
  return `<div class="tiles">${tile(all.filter(isLive).length,'Live across the team')}${tile(all.filter(isBench).length,'On the bench')}${tile(all.filter(waiting).length,'Waiting on a setter',all.some(takeable)?'bad':'')}${tile(S.conversations.filter(c=>inR(c.booked_at,'today')).length,'Booked today','good')}${tile(S.conversations.filter(c=>inR(c.booked_at,'week')).length,'Booked this week')}</div>
  <div class="box" style="margin-bottom:18px"><h3>Open to take over · ${open.length} · prospect replied ${S.cfg.take}+ minutes ago, no answer</h3>${open.map(c=>`<div class="row">${ig(c)}<span class="note">with <b>${esc(nm(c.booker_id))}</b></span><span class="pill ${c.stage}">${LABEL[c.stage]}</span><span style="color:var(--bad);font-weight:700">unanswered ${clock(c,'')}</span><span class="sp">${canTake?B('take',c.id,'Take over','s r'):''}</span></div>`).join('')||'<div class="empty">Nothing open. Every reply has been answered inside the limit.</div>'}</div>
  <div class="line"><input type="text" id="q" data-f="q" placeholder="Search a handle to see who has it" value="${esc(ui.q)}" autocomplete="off"></div>
  <div class="team">${st.map(s=>{const mine=mineOf(s.id).filter(isOpen),lv=mine.filter(isLive).sort((a,b)=>el(a)-el(b)),bn=mine.filter(isBench).sort((a,b)=>el(a)-el(b));const rw=c=>`<div class="row">${ig(c)}${clock(c)}<span class="tag ${takeable(c)?'b':c.last_dir==='received'?'w':''}">${c.last_dir==='received'?'they replied':'setter sent'}</span><span class="sp"><span class="pill ${c.stage}">${LABEL[c.stage]}</span></span></div>`;
    return `<div class="box"><h2 style="display:flex;justify-content:space-between"><span>${esc(s.name)}${s.id===m.id?' (you)':''}</span><span style="color:${lv.length>S.cfg.cap?'var(--bad)':'inherit'}">${lv.length}/${S.cfg.cap} live</span></h2><h3>Live</h3>${lv.filter(hit).map(rw).join('')||'<div class="empty">None live.</div>'}<h3 style="margin-top:14px">Bench · ${bn.length}</h3>${bn.filter(hit).map(rw).join('')||'<div class="empty">Empty.</div>'}</div>`}).join('')||'<div class="box empty">No setters added yet. Add them in the Manager tab.</div>'}</div>`;
}

function lbView(){
  const r=ui.range;
  const rows=setters().map(s=>{const sp=speed(s.id,r);return{n:s.name,b:S.conversations.filter(c=>c.booker_id===s.id&&inR(c.booked_at,r)).length,live:mineOf(s.id).filter(isLive).length,st:S.conversations.filter(c=>c.opener_id===s.id&&inR(c.created_at,r)).length,sp,won:S.conversations.filter(c=>c.booker_id===s.id&&c.taken_from&&inR(c.taken_at,r)).length,lost:S.conversations.filter(c=>c.taken_from===s.id&&inR(c.taken_at,r)).length}}).sort((a,b)=>b.b-a.b||b.st-a.st);
  const medal=i=>['🥇','🥈','🥉'][i]||i+1;
  return `<div class="seg">${[['today','Today'],['week','This week'],['30d','Last 30 days']].map(x=>`<button class="${r===x[0]?'on':''}" data-a="range" data-id="${x[0]}">${x[1]}</button>`).join('')}</div>
  <div class="box"><h2>Booked calls</h2><div style="overflow-x:auto">${rows.length?`<table><tr><th></th><th>Setter</th><th class="num">Booked</th><th class="num">Live now</th><th class="num">Conversations started</th><th class="num">Replies inside ${S.cfg.take} min</th><th class="num">Average reply time</th><th class="num">Took over</th><th class="num">Lost to takeover</th></tr>${rows.map((x,i)=>`<tr><td class="rank">${medal(i)}</td><td><b>${esc(x.n)}</b></td><td class="num bign">${x.b}</td><td class="num">${x.live}/${S.cfg.cap}</td><td class="num">${x.st}</td><td class="num">${x.sp.pct}</td><td class="num">${x.sp.avg}</td><td class="num">${x.won}</td><td class="num" style="${x.lost?'color:var(--bad);font-weight:700':''}">${x.lost}</td></tr>`).join('')}</table>`:'<div class="empty">No setters added yet.</div>'}</div><p class="note" style="margin-top:12px">A booking counts for whoever owns the conversation when it is booked. Reply time is measured from "Message received" to the next "Message sent".</p></div>`;
}

function allRows(){
  const q=ui.q.trim().toLowerCase().replace(/^@/,''),f=ui.filter,st=setters();
  const list=S.conversations.filter(c=>{if(q)return c.ig_handle.includes(q);if(f==='open')return isOpen(c);if(f==='booked')return c.stage==='booked';if(f==='closed')return c.stage==='dead'||c.stage==='ghosted';return true}).slice(0,300);
  return list.length?list.map(c=>`<tr><td>${ig(c)}</td><td><span class="pill ${c.stage}">${LABEL[c.stage]||c.stage}</span>${isOpen(c)?` <span class="tag">${isLive(c)?'live':'bench'}</span>`:''}${c.stage==='dead'&&c.dead_reason?`<div class="note">${esc(c.dead_reason)}</div>`:''}</td><td>${S.is_admin&&isOpen(c)?`<select data-re="${c.id}"><option value="">${esc(nm(c.booker_id))}</option>${st.filter(b=>b.id!==c.booker_id).map(b=>`<option value="${b.id}">→ ${esc(b.name)}</option>`).join('')}</select>`:`<b>${esc(nm(c.booker_id))}</b>`}</td><td>${esc(nm(c.opener_id))}</td><td>${c.taken_from?esc(nm(c.taken_from))+` <span class="note">${new Date(c.taken_at).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>`:'—'}</td><td>${isOpen(c)?`${clock(c,'')} <span class="note">${c.last_dir==='received'?'they replied':'setter sent'}</span>`:'—'}</td><td class="num note">${new Date(c.created_at).toLocaleDateString([], {month:'short',day:'numeric'})}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">Nothing here.</td></tr>';
}
function allView(){
  return `<div class="box"><div class="line"><input type="text" id="q" data-f="q" placeholder="Search a handle to see who owns it" value="${esc(ui.q)}" autocomplete="off"><div class="seg" style="margin:0">${[['open','Open'],['booked','Booked'],['closed','Closed'],['all','All']].map(x=>`<button class="${ui.filter===x[0]?'on':''}" data-a="filter" data-id="${x[0]}">${x[1]}</button>`).join('')}</div></div><div style="overflow-x:auto"><table><thead><tr><th>Prospect</th><th>Stage</th><th>Owner</th><th>Started by</th><th>Taken over from</th><th>Last message</th><th class="num">Started</th></tr></thead><tbody id="rows">${allRows()}</tbody></table></div></div>`;
}

function adminView(){
  const a=S.admin||{},c=S.cfg,link=SITE+'/?k='+(a.team_code||'');
  return `<div class="grid2"><div>
  <div class="box"><h2>Team</h2>${S.setters.map(s=>`<div class="line"><input type="text" id="n_${s.id}" value="${esc(s.name)}"><select id="r_${s.id}"><option value="setter" ${s.role!=='manager'?'selected':''}>Setter</option><option value="manager" ${s.role==='manager'?'selected':''}>Manager</option></select><label style="margin:0;font-weight:500"><input type="checkbox" id="a_${s.id}" ${s.active?'checked':''}> Active</label>${B('saveSetter',s.id,'Save')}</div>`).join('')}
  <h3 style="margin-top:16px">Add someone</h3><div class="line"><input type="text" id="n_new" placeholder="Name"><select id="r_new"><option value="setter">Setter</option><option value="manager">Manager</option></select>${B('addSetter','','Add','s d')}</div></div>
  <div class="box sec"><h2>Team link</h2><p class="note">Send this to the setters. It lets them straight in.</p><div class="line"><input type="text" readonly value="${esc(link)}">${B('copy',esc(link),'Copy')}</div></div>
  </div><div>
  <div class="box"><h2>Rules</h2><label>Live conversations per setter</label><input type="number" id="s_cap" value="${c.cap}" min="1"><label>Minutes since the last message before a conversation drops to the bench</label><input type="number" id="s_bench" value="${c.bench}" min="1"><label>Minutes a prospect's reply can sit unanswered before another setter may take it over</label><input type="number" id="s_take" value="${c.take}" min="1"><label style="font-weight:500"><input type="checkbox" id="s_protect" ${c.protect?'checked':''}> Block takeovers once the booking link has been sent</label><button class="btn d big" data-a="saveRules">Save rules</button></div>
  <div class="box sec"><h2>Slack · #dm-handoff</h2><p class="note">${S.slack_configured?'Connected. Booked calls and takeovers post to the channel.':'Not connected. Paste the incoming webhook URL below.'}</p><div class="line"><input type="text" id="s_hook" placeholder="${S.slack_configured?'Paste a new webhook URL to replace the current one':'https://hooks.slack.com/services/…'}" autocomplete="off">${B('saveHook','','Save','s d')}${B('testSlack','','Send test')}</div></div>
  </div></div>`;
}

function draw(){
  const app=$('#app'),a=document.activeElement,fid=a&&a.id,pos=a&&a.selectionStart;
  if(!code||!S){app.innerHTML=gate();return}
  const m=me();
  if(!m){app.innerHTML=who();return}
  const ts=tabsFor(m);if(!ts.some(t=>t[0]===tab))tab=ts[0][0];
  const v=tab==='mine'?mineView(m):tab==='lb'?lbView():tab==='admin'?adminView():tab==='all'?allView():teamView(m);
  app.innerHTML=shell(m)+'<main>'+v+'</main>';sig=sigNow();
  if(fid){const e=document.getElementById(fid);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
}

/* ---------- actions ---------- */
const H={
  enter(){const v=($('#codeIn').value||'').trim();if(!v)return;code=v;LS.set('de_code',v);refresh()},
  pick(e){meId=e.dataset.id;LS.set('de_me',meId);tab='';draw()},
  switch(){meId='';LS.set('de_me',null);draw()},
  tab(e){tab=e.dataset.id;LS.set('de_tab',tab);ui.deadFor=null;ui.q='';draw()},
  async add(e){const v=(draft.ig||'').trim();if(!v)return toast('Type the Instagram handle first',true);const r=await act('add',{ig_handle:v,dir:e.dataset.id});if(r){draft.ig='';draw();toast('Added. Clock is running.')}},
  ping(e){const p=e.dataset.id.split('|');act('ping',{id:p[0],dir:p[1]})},
  mv(e){const p=e.dataset.id.split('|');act('move',{id:p[0],to:p[1]},p[1]==='booked'?'Booked. Nice.':null)},
  take(e){act('take',{id:e.dataset.id},'It is yours. Reply now.')},
  deadq(e){ui.deadFor=e.dataset.id;draw()},
  deadx(){ui.deadFor=null;draw()},
  dead(e){const p=e.dataset.id.split('|');ui.deadFor=null;act('move',{id:p[0],to:'dead',dead_reason:DEAD[+p[1]]})},
  copy(e){copy(e.dataset.id)},
  range(e){ui.range=e.dataset.id;draw()},
  filter(e){ui.filter=e.dataset.id;draw()},
  saveSetter(e){const id=e.dataset.id;act('admin_setter',{id,name:$('#n_'+id).value,role:$('#r_'+id).value,active:$('#a_'+id).checked},'Saved')},
  addSetter(){act('admin_setter',{name:$('#n_new').value,role:$('#r_new').value},'Added')},
  saveRules(){act('admin_settings',{active_cap:$('#s_cap').value,bench_minutes:$('#s_bench').value,takeover_minutes:$('#s_take').value,protect_link:$('#s_protect').checked?'1':'0',site_url:SITE},'Rules saved')},
  saveHook(){const v=$('#s_hook').value.trim();if(!v)return toast('Paste the webhook URL first',true);act('admin_settings',{slack_webhook:v,site_url:SITE},'Slack connected')},
  async testSlack(){const r=await act('admin_test_slack');if(r)toast(r.slack==='sent'?'Test sent to Slack':'Slack is not connected or rejected it',r.slack!=='sent')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&H[b.dataset.a]){e.preventDefault();H[b.dataset.a](b)}});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset&&t.dataset.f;if(f==='ig')draft.ig=t.value;if(f==='q'){ui.q=t.value;const r=$('#rows');if(r)r.innerHTML=allRows();else draw()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.re&&t.value)act('admin_reassign',{id:t.dataset.re,booker_id:t.value},'Reassigned')});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='codeIn')H.enter();if(e.target.id==='addIg')H.add({dataset:{id:'received'}})});
const typingAdmin=()=>{const a=document.activeElement;return tab==='admin'&&a&&['INPUT','SELECT'].includes(a.tagName)};
// Stopwatches tick every second; redraw only when a conversation crosses a line (bench, takeover).
setInterval(()=>{if(!S||!me())return;document.querySelectorAll('[data-ts]').forEach(x=>{x.textContent=fmt(Math.max(0,nowMs()-(+x.dataset.ts)))});if(!busy&&!ui.deadFor&&!typingAdmin()&&sigNow()!==sig)draw()},1000);
setInterval(()=>{if(!code||document.hidden||busy)return;refresh(!typingAdmin()&&!ui.deadFor)},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&code)refresh()});
if(code)refresh();else draw();
</script>
</body>
</html>
